# ACP profile set for the HDA Intel PCH card: the speakers plus one HDMI port
# per profile, so both show up as outputs. The stock set only has
# speakers-only and HDMI-only profiles. select-plugged-hdmi-profile.lua
# picks the profile whose HDMI port is plugged in; the speakers-only profile
# outranks the combined ones so it wins when nothing is.

[General]
auto-profiles = no

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = analog-output analog-output-lineout analog-output-speaker analog-output-headphones analog-output-headphones-2
paths-input = analog-input-front-mic analog-input-rear-mic analog-input-internal-mic analog-input-dock-mic analog-input analog-input-mic analog-input-linein analog-input-aux analog-input-video analog-input-tvtuner analog-input-fm analog-input-mic-line analog-input-headphone-mic analog-input-headset-mic
priority = 15

[Mapping hdmi-stereo]
description = Digital Stereo (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = left,right
priority = 9
direction = output

[Mapping hdmi-stereo-extra1]
description = Digital Stereo (HDMI 2)
device-strings = hdmi:%f,1
paths-output = hdmi-output-1
channel-map = left,right
priority = 7
direction = output

[Mapping hdmi-stereo-extra2]
description = Digital Stereo (HDMI 3)
device-strings = hdmi:%f,2
paths-output = hdmi-output-2
channel-map = left,right
priority = 7
direction = output

[Mapping hdmi-stereo-extra3]
description = Digital Stereo (HDMI 4)
device-strings = hdmi:%f,3
paths-output = hdmi-output-3
channel-map = left,right
priority = 7
direction = output

[Profile output:analog-stereo+input:analog-stereo]
description = Analog Stereo Duplex
output-mappings = analog-stereo
input-mappings = analog-stereo
priority = 6565

[Profile output:analog-stereo+output:hdmi-stereo+input:analog-stereo]
description = Analog Stereo Duplex + Digital Stereo (HDMI) Output
output-mappings = analog-stereo hdmi-stereo
input-mappings = analog-stereo
priority = 6000

[Profile output:analog-stereo+output:hdmi-stereo-extra1+input:analog-stereo]
description = Analog Stereo Duplex + Digital Stereo (HDMI 2) Output
output-mappings = analog-stereo hdmi-stereo-extra1
input-mappings = analog-stereo
priority = 6000

[Profile output:analog-stereo+output:hdmi-stereo-extra2+input:analog-stereo]
description = Analog Stereo Duplex + Digital Stereo (HDMI 3) Output
output-mappings = analog-stereo hdmi-stereo-extra2
input-mappings = analog-stereo
priority = 6000

[Profile output:analog-stereo+output:hdmi-stereo-extra3+input:analog-stereo]
description = Analog Stereo Duplex + Digital Stereo (HDMI 4) Output
output-mappings = analog-stereo hdmi-stereo-extra3
input-mappings = analog-stereo
priority = 6000
